[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openshell-tg"
version = "0.1.0"
description = "Approve OpenShell sandbox network rules from Telegram. One command per project folder."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
openshell-tg = "openshell_tg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openshell_tg = ["templates/*", "profiles/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

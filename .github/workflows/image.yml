name: agent image
# Builds the sandbox image for a release tag (v1.2.3 -> image tag 1.2.3).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "tag=$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      # OpenShell's VM driver reads only a single OCI image manifest: no Docker
      # schema 2 manifest, and no attestation index (provenance, sbom).
      - uses: docker/build-push-action@v6
        with:
          context: image
          provenance: false
          sbom: false
          outputs: type=registry,oci-mediatypes=true
          tags: ghcr.io/${{ github.repository_owner }}/openshell-tg-agent:${{ steps.version.outputs.tag }}

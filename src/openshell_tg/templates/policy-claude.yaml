# OpenShell sandbox policy, in OpenShell's own format.
# Contains only what the claude subscription login and model API need.
# The agent asks for other addresses and you approve them in Telegram.
version: 1

network_policies:
  claude_subscription:
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
      - host: claude.ai
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
      - host: platform.claude.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
      - host: console.anthropic.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
      - host: statsig.anthropic.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
      - host: api.github.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
      - host: github.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
      - host: raw.githubusercontent.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
      - host: downloads.claude.ai
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
      - host: mcp-proxy.anthropic.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
      - host: http-intake.logs.us5.datadoghq.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
    binaries:
      - path: /usr/bin/claude
      - path: /usr/lib/node_modules/@anthropic-ai/**

# Files the agent may read and write. Everything else is read-only or hidden.
# The /dev entries let tmux open a terminal for the agent; keep them.
# To let the agent change only part of the folder, set include_workdir: false and
# list the folders under read_write (applies on rebuild).
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log]
  read_write: [/tmp, /dev/null, /dev/ptmx, /dev/pts, /dev/tty, /dev/zero]

# OpenShell sandbox policy, in OpenShell's own format.
# Contains only what the codex subscription login and model API need.
# The agent asks for other addresses and you approve them in Telegram.
version: 1

network_policies:
  codex_subscription:
    endpoints:
      - host: api.openai.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
      - host: auth.openai.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
      - host: chatgpt.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
      - host: ab.chatgpt.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
    binaries:
      - path: /usr/bin/codex
      - path: /usr/lib/node_modules/@openai/**

# To let the agent change only part of the folder, add (applies on rebuild):
# filesystem_policy:
#   include_workdir: false
#   read_only: [/sandbox/workspace]
#   read_write: [/sandbox/workspace/src/my_module, /sandbox/workspace/.git, /tmp]
